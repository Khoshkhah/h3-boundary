[build-system]
requires = ["setuptools>=77", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-boundary"
description = "H3 cell boundary tracing and buffered polygons across resolution hierarchies, with optional C++ acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaveh Khoshkhah" }]
keywords = ["h3", "hexagon", "geospatial", "spatial-index", "boundary", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]
dependencies = [
    "h3>=4.0.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "folium",
    "jupyter",
]

[project.urls]
Homepage = "https://github.com/Khoshkhah/h3-toolkit"
Documentation = "https://khoshkhah.github.io/h3-toolkit/"
Repository = "https://github.com/Khoshkhah/h3-toolkit"
Issues = "https://github.com/Khoshkhah/h3-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.dynamic]
version = { attr = "h3_boundary.__version__" }
